name: SkewLab feature branch full QA (owner Mac)
on:
  push:
    branches: [feat/polymarket-100-paper-scanner]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skewlab-feature-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Never run untrusted pull-request code on a personal self-hosted runner.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, skewlab-mac]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Full tests with race detector
        run: go test -race ./...
      - name: BDD Given/When/Then traceability and changed-code gate
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "${BASE_SHA}" ]]; then
            go run ./cmd/bdd-gate --base "${BASE_SHA}"
          else
            go run ./cmd/bdd-gate
          fi
      - name: Static analysis
        run: go vet ./...
      - name: Build bot and both read-only audit tools
        run: |
          go build -o "$RUNNER_TEMP/skewlab-bot" ./cmd/bot
          go build -o "$RUNNER_TEMP/skewlab-replay-audit" ./cmd/replay-audit
          go build -o "$RUNNER_TEMP/skewlab-polymarket-scan" ./cmd/polymarket-scan
