name: Go unit and integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Build bot, backtest and oracle audit
        run: |
          go build ./cmd/bot
          go build ./cmd/backtest
          go build ./cmd/oracle-audit
