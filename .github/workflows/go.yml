name: Go unit and integration checks (Mac self-hosted)

# Only trusted main-branch pushes and explicit owner-triggered runs can
# execute on the owner's personal Mac. Do NOT run fork PRs on a personal runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skewlab-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests / Apple Silicon Mac
    runs-on: [self-hosted, macOS, ARM64, skewlab-mac]
    timeout-minutes: 30
    steps:
      - name: Verify runner environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers -productVersion
          xcode-select -p
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit and integration tests (race detector)
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Build bot, backtest, oracle audit and public feedcheck
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/skewlab-bot" ./cmd/bot
          go build -o "$RUNNER_TEMP/skewlab-backtest" ./cmd/backtest
          go build -o "$RUNNER_TEMP/skewlab-oracle-audit" ./cmd/oracle-audit
          go build -o "$RUNNER_TEMP/skewlab-feedcheck" ./cmd/feedcheck
          go build -o "$RUNNER_TEMP/skewlab-coverage" ./cmd/coverage
          go build -o "$RUNNER_TEMP/skewlab-replay-audit" ./cmd/replay-audit
          go build -o "$RUNNER_TEMP/skewlab-edgecheck" ./cmd/edgecheck
