name: QuantSkew cross-market PR checks
on:
  pull_request:
    branches: [main, feat/polymarket-100-paper-scanner]
    paths:
      - 'internal/crossmarket/**'
      - 'internal/polymarketv2/**'
      - 'go.mod'
      - '.github/workflows/crossmarket-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crossmarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/crossmarket ./internal/polymarketv2
      - run: go vet ./internal/crossmarket ./internal/polymarketv2
