name: QuantSkew V2 paper-only verification
on:
  push:
    branches: [feat/quantskew-v2-paper-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-tests:
    runs-on: [self-hosted, macOS, ARM64, skewlab-mac]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/backtest
      - run: go build ./cmd/bot
